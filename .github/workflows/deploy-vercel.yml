name: Deploy FinOrbit to Vercel

on:
  push:
    paths:
      - ".github/workflows/deploy-vercel.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || vars.VERCEL_TOKEN }}
      VERCEL_SCOPE: vamshis-projects-9a4d887a
    steps:
      - uses: actions/checkout@v4

      - name: Check Vercel token
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::VERCEL_TOKEN is not available as a repository/environment secret or variable."
            exit 1
          fi

      - name: Ensure Vercel project exists
        run: |
          npx --yes vercel@latest project add fintech-application \
            --scope "$VERCEL_SCOPE" \
            --token "$VERCEL_TOKEN" || true

      - name: Deploy production
        run: |
          URL=$(npx --yes vercel@latest deploy --prod --yes \
            --scope "$VERCEL_SCOPE" \
            --project fintech-application \
            --token "$VERCEL_TOKEN")
          echo "Production URL: $URL"
          echo "### Production deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "$URL" >> "$GITHUB_STEP_SUMMARY"
